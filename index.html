<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shipment Delay Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🚚 Shipment Delay Predictor</h1>

    <input id="origin" placeholder="Origin Port">
    <input id="destination" placeholder="Destination Port">
    <input id="carrier" placeholder="Carrier Name">
    <input id="transit" placeholder="Transit Days">

    <button onclick="predictDelay()">Predict Delay</button>

    <div id="result"></div>

<div class="meter-container">
  <div class="meter-bar">
    <div id="meterFill" class="meter-fill"></div>
  </div>
</div>

<div id="aiNote" class="ai-note"></div>

<h3>📊 Prediction History</h3>
<table class="history-table">
  <thead>
    <tr>
      <th>Origin</th>
      <th>Destination</th>
      <th>Carrier</th>
      <th>Transit</th>
      <th>Risk</th>
    </tr>
  </thead>
  <tbody id="historyBody"></tbody>
</table>

  </div>

  <script src="script.js"></script>
</body>
</html>
